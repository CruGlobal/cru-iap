name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The only job here that touches the network, and the only one that can catch
  # Google changing the contract all five libraries share. Deliberately not
  # gated on any language's toolchain or dependencies: it is stdlib-only Node,
  # so it still reports even when a language job is broken.
  #
  # The other half of e2e/smoke.mjs (`iap-front`) is NOT run here — it needs a
  # standing IAP stack, and the e2e stack is created on demand and torn down
  # again. It runs inside the e2e workflow, after apply.
  smoke:
    name: Smoke (Google JWKS contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Google's key endpoint still serves ES256 / P-256 keys
        run: node e2e/smoke.mjs jwks

  spec:
    name: Ruby
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # See .github/scripts/ci-version.sh for what each leg resolves to.
        version: [min, latest]
    steps:
      - uses: actions/checkout@v5
      - name: Resolve version
        id: version
        run: |
          version=$(.github/scripts/ci-version.sh ruby ${{ matrix.version }})
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ruby $version"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.version.outputs.version }}
          bundler-cache: true

      # Two steps rather than one `rspec`, so a failure names which layer
      # broke — and so the unit suite is proven to pass in a process where
      # Rails was never loaded. Neither suite touches the network.
      - name: Unit specs (no Rails loaded)
        run: bundle exec rake unit

      - name: Integration specs (dummy Rails app, real signed JWTs)
        run: bundle exec rake integration

  npm:
    name: TypeScript
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # latest is the newest LTS, which is what consumers (bills) run.
        version: [min, latest]
    steps:
      - uses: actions/checkout@v5
      - name: Resolve version
        id: version
        run: |
          version=$(.github/scripts/ci-version.sh node ${{ matrix.version }})
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "node $version"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.version.outputs.version }}
          cache: npm

      # `npm ci` runs `prepare`, so this also proves the build a consumer gets
      # from `npm i github:CruGlobal/cru-iap` actually succeeds.
      - run: npm ci

      - name: Typecheck (library + tests)
        run: npm run typecheck

      # Offline: real ES256 signing and a real JWKS parse, but the only network
      # hop (Google's key endpoint) is stubbed. The e2e suite is deliberately
      # NOT run here — it needs live GCP and Okta credentials.
      - name: Unit tests
        run: npm test

  pytest:
    name: Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [min, latest]
    steps:
      - uses: actions/checkout@v5
      - name: Resolve version
        id: version
        run: |
          version=$(.github/scripts/ci-version.sh python ${{ matrix.version }})
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "python $version"
      # uv can't resolve `3.x` itself, so setup-python turns it into a real
      # version for `uv run --python`.
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: ${{ steps.version.outputs.version }}
      # Exact tag, not a floating major: setup-uv publishes moving `vN` refs only
      # up to v7, while v8 and v9 exist as full tags alone — so `@v9` does not
      # resolve at all. Pinned to the current release rather than dropping back to
      # the newest floating major, which is two majors behind.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # --frozen so a stale uv.lock fails the build rather than being silently
      # re-resolved into something no one has run.
      - name: Unit tests
        run: uv run --frozen --python ${{ steps.python.outputs.python-version }} pytest

  gotest:
    name: Go
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # min (go.mod's floor) is also what wormhole runs.
        version: [min, latest]
    steps:
      - uses: actions/checkout@v5
      - name: Resolve version
        id: version
        run: |
          version=$(.github/scripts/ci-version.sh go ${{ matrix.version }})
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "go $version"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.version.outputs.version }}
          # setup-go keys its module cache on go.sum, which a stdlib-only package
          # does not have — leaving it on emits a "Restore cache failed" warning
          # on every run for a cache that could never hold anything.
          cache: false

      # The package is stdlib-only by design, so there is nothing to download
      # and a `go mod tidy` diff is a real regression rather than churn.
      # `git status --porcelain` rather than `git diff`: go.sum does not exist,
      # and diff treats an absent pathspec as a fatal error.
      - name: Tidy is a no-op (no dependencies crept in)
        run: |
          set -euo pipefail
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            git status --porcelain go.mod go.sum
            echo "::error::go mod tidy changed go.mod/go.sum — a dependency crept into a stdlib-only package"
            exit 1
          fi

      - name: Vet
        run: go vet ./cruiap/...

      # The e2e suite is behind the `e2e` build tag and so is not compiled here.
      - name: Unit tests
        run: go test ./cruiap/...

  cargo:
    name: Rust
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [min, latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: Resolve version
        id: version
        run: |
          version=$(../.github/scripts/ci-version.sh rust ${{ matrix.version }})
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rust $version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.version.outputs.version }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      # The live suite needs the `e2e` feature and is not compiled here.
      - name: Unit tests (all features but e2e)
        run: cargo test --features axum

      # Proves the crate still builds and verifies with a caller-supplied
      # KeySource and no reqwest or tokio.
      - name: Unit tests (no default features)
        run: cargo test --no-default-features
